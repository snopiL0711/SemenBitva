<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DVD Arena</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            color: #e2e8f0;
        }
        canvas {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: block;
            width: 800px;
            height: 600px;
            background: #020617;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
        }
        #ui {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2,6,23,0.94);
            font-family: Arial, sans-serif;
            color: #e2e8f0;
            z-index: 10;
        }
        #ui .hidden { display: none !important; }
        .panel { width: 520px; text-align: center; }
        .panel h1 { margin: 0 0 6px; font-size: 54px; letter-spacing: 3px; color: #fde047; text-shadow: 0 0 24px rgba(250,204,21,0.5); }
        .panel h2 { margin: 0 0 4px; font-size: 26px; }
        .panel p { margin: 4px 0 14px; color: #94a3b8; font-size: 14px; }
        .panel input { background: #0f172a; border: 2px solid #334155; color: #f1f5f9; border-radius: 10px; padding: 12px 14px;
                       font-size: 17px; width: 100%; box-sizing: border-box; text-align: center; outline: none; }
        .panel input:focus { border-color: #38bdf8; }
        .panel button { display: block; width: 100%; margin-top: 10px; padding: 13px; font-size: 18px; font-weight: bold; cursor: pointer;
                        border: 0; border-radius: 10px; background: #f59e0b; color: #1e1b4b; }
        .panel button:hover { filter: brightness(1.12); }
        .panel button.ghost { background: #1e293b; color: #cbd5e1; border: 2px solid #334155; }
        .panel button:disabled { opacity: 0.5; cursor: default; }
        .row { display: flex; gap: 10px; margin-top: 10px; }
        .row input { flex: 1; letter-spacing: 6px; text-transform: uppercase; }
        .row button { flex: 1.2; margin-top: 0; background: #38bdf8; }
        #menuMsg { margin-top: 12px; min-height: 20px; color: #fca5a5; font-size: 14px; }
        #lobbyCode { color: #fde047; letter-spacing: 5px; }
        #roles { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
        .role { width: 96px; padding: 8px 4px 10px; border: 2px solid #334155; border-radius: 12px; background: #0f172a; cursor: pointer; }
        .role:hover { border-color: #64748b; }
        .role.taken { opacity: 0.85; cursor: default; }
        .role.mine { border-color: #fde047; box-shadow: 0 0 14px rgba(250,204,21,0.5); opacity: 1; cursor: pointer; }
        .role img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #1e293b; display: block; margin: 0 auto 6px; }
        .role b { display: block; font-size: 14px; }
        .role .side { font-size: 11px; display: block; margin: 2px 0; }
        .role .side.enemy { color: #f87171; } .role .side.team { color: #38bdf8; }
        .role em { display: block; font-style: normal; font-size: 12px; color: #94a3b8; min-height: 15px; overflow: hidden; }
        .role.taken em, .role.mine em { color: #bbf7d0; font-weight: bold; }
        #players { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
    <div id="menu" class="panel">
        <h1>DVD ARENA</h1>
        <p>Онлайн-битва: Семён и Глеб против Вани, Дани и Матвея</p>
        <input id="nameInp" maxlength="16" placeholder="Ваш ник">
        <button id="btnCreate">Создать лобби</button>
        <div class="row"><input id="codeInp" maxlength="4" placeholder="КОД"><button id="btnJoin">Присоединиться</button></div>
        <button id="btnSolo" class="ghost">Играть одному (остальные — боты)</button>
        <div id="menuMsg"></div>
    </div>
    <div id="lobby" class="panel hidden" style="width:560px">
        <h2>Лобби <span id="lobbyCode"></span></h2>
        <p>Отправьте код друзьям. Выберите роль — свободные роли играют боты.</p>
        <div id="roles"></div>
        <div id="players"></div>
        <button id="btnStart">Старт</button>
        <button id="btnLeave" class="ghost">Выйти</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const isObs = new URLSearchParams(location.search).has('obs') || new URLSearchParams(location.search).has('transparent');
if (isObs) {
    document.documentElement.style.background = 'transparent';
    document.body.style.background = 'transparent';
    canvas.style.background = 'transparent';
    canvas.style.boxShadow = 'none';
}
let W = 0, H = 0;
let map = null, obstacles = [], bg = null;      // карта (объявлено до первого resize)
function resize() {
    W = canvas.width = 800;      // фиксированное окно 800x600
    H = canvas.height = 600;
    if (map) buildMap();
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const S = () => clamp(H / 800, 0.6, 1.5);          // масштаб карты под высоту экрана

/* ================= Настройки ================= */
const CFG = {
    enemyHP: 50,
    helperHP: 15,
    teamHP: 10,
    enemySize: 60,
    helperSize: 60,
    teamSize: 60,
    enemySpeed: 170,        // px/сек
    helperSpeed: 160,
    teamSpeed: 150,
    boostMult: 1.7,
    boostTime: 5,
    shieldTime: 4,
    tripleTime: 10,
    shrinkTime: 5,
    shrinkScale: 0.55,
    freezeTime: 10,         // остановка времени
    spawnEvery: 3,
    maxPickups: 4,
    pickupLife: 10,
    hitCooldown: 0.6,

    // ивенты
    eventGap: 30,           // пауза до следующего ивента
    potionTime: 3,
    potionFlight: 0.7,
    mutantSize: 60,
    mutantSpeed: 155,
    acidDamage: 2,
    dissolveTime: 1.6,
    puddleR: 46,
    puddleLife: 10,
    puddleTick: 1,
    bossHP: 200,
    bossTeamHP: 25,         // HP игроков в битве с боссом
    bossSize: 84,
    bossSpeed: 150,
    reviveChance: 0.3,      // шанс возрождения после растворения
    angelTime: 2.4,
    swordShort: 0.3,        // длина мечей у игроков (как нож)
    swordLong: 1.8,         // длина мечей у врага

    // пук Семёна
    fartMin: 5,
    fartMax: 10,
    dashTime: 0.4,
    dashMult: 2.6
};

/* Список ивентов. Новые можно добавлять сюда */
const EVENTS = [
    { id: 'acid', name: 'КИСЛОТНЫЙ ДОЖДЬ', duration: 30, color: '#a3e635', endText: 'ДОЖДЬ ЗАКОНЧИЛСЯ' },
    { id: 'enemyboost', name: 'БУСТЫ ДЛЯ ВРАГА', duration: 30, color: '#fbbf24', endText: 'ВРАГ БОЛЬШЕ НЕ БЕРЁТ БУСТЫ' },
    { id: 'swords', name: 'УКОРОЧЕНИЕ МЕЧЕЙ', duration: 30, color: '#fb7185', endText: 'МЕЧИ ВЕРНУЛИСЬ' }
];

/* ================= Картинки и ники ================= */
function loadImg(src) { const im = new Image(); im.src = src; return im; }
const IMGS = {
    enemy: loadImg('photo.jpg'),
    helper: loadImg('photohelper.jpg'),
    t1: loadImg('photo1.jpg'),
    t2: loadImg('photo2.jpg'),
    t3: loadImg('photo3.jpg'),
    boss: loadImg('boss.jpg')
};
const FACES = [
    { img: IMGS.enemy, nick: 'Семён', side: 'enemy' },
    { img: IMGS.helper, nick: 'Глеб', side: 'enemy' },
    { img: IMGS.t1, nick: 'Ваня', side: 'team' },
    { img: IMGS.t2, nick: 'Даня', side: 'team' },
    { img: IMGS.t3, nick: 'Матвей', side: 'team' }
];
const ROLES = [
    { id: 'semyon', nick: 'Семён', team: 'enemy', photo: 'photo.jpg' },
    { id: 'gleb', nick: 'Глеб', team: 'enemy', photo: 'photohelper.jpg' },
    { id: 'vanya', nick: 'Ваня', team: 'team', photo: 'photo1.jpg' },
    { id: 'danya', nick: 'Даня', team: 'team', photo: 'photo2.jpg' },
    { id: 'matvey', nick: 'Матвей', team: 'team', photo: 'photo3.jpg' }
];
const imgByNick = nick => {
    if (!nick) return IMGS.enemy;
    if (nick === 'БОСС') return IMGS.boss;
    const f = FACES.find(f => f.nick === nick);
    return (f && f.img) ? f.img : IMGS.enemy;
};
const ready = im => !!(im && im.complete && im.naturalWidth > 0);

/* ================= Сеть и камера: состояние ================= */
const net = {
    mode: 'none',          // none | solo | host | guest
    running: false, ws: null, id: null, name: '', isHost: false,
    lobby: null, myRole: null, inputs: {}, fx: [], snapAcc: 0, inAcc: 0,
    haveSnap: false, freezeActive: false, camOn: true
};
const cam = { x: 0, y: 0, z: 1, init: false };
let frameDt = 0.016;

/* ================= Состояние ================= */
let angels = [], droppedSwords = [], confetti = [];
let stage = 1, playersWon = false, victoryT = 0, fwT = 0;
const ARENA1 = { x: 165, y: 56, w: 470, h: 484 };      // стартовая (маленькая) арена
const ARENA2 = { x: 0, y: 0, w: 800, h: 600 };        // арена босса (во всё окно)
let arena = { ...ARENA1 }, arenaTarget = { ...ARENA1 };
let ents, enemy, helperEnt, pickups, particles, puffs, puddles, drops, ripples, texts;
let spawnT, countT, goT, state, ev, last = performance.now();
let freeze = { t: 0, owner: null, wave: 0, bannerT: 0, bannerText: '' };
let freezeActive = false;
const keys = {};
let nextId = 1;

const frozen = e => freezeActive && e !== freeze.owner;

function makeEnt(o) {
    const a = Math.random() * Math.PI * 2;
    return Object.assign({
        id: nextId++,
        vx: Math.cos(a), vy: Math.sin(a),
        boostT: 0, shieldT: 0, tripleT: 0, shrinkT: 0, flash: 0, dashT: 0, puddleCd: 0,
        swordMul: 1, acidSword: false, extraSwords: 0,
        angle: Math.random() * 6, hits: new Map(), alive: true
    }, o, { baseR: o.r });
}

/* ================= Карта: только открытое поле ================= */
const MAPS = [{ id: 'field', name: 'Открытое поле', build() { return []; }, paint: null }];

function buildMap() {
    obstacles = map.build();
    bg = null;
    if (map.paint) {
        bg = document.createElement('canvas');
        bg.width = W; bg.height = H;
        map.paint(bg.getContext('2d'));
    }
}

function isClear(x, y, r, margin = 10) {
    for (const o of obstacles) {
        if (o.t === 'circle') {
            if (Math.hypot(x - o.x, y - o.y) < o.r + r + margin) return false;
        } else {
            const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
            if (Math.hypot(x - cx, y - cy) < r + margin) return false;
        }
    }
    return true;
}

function findSpot(r, x0, x1, y0, y1, others) {
    for (let n = 0; n < 300; n++) {
        const x = rand(x0 + r, Math.max(x0 + r + 1, x1 - r));
        const y = rand(y0 + r, Math.max(y0 + r + 1, y1 - r));
        if (isClear(x, y, r, 8) && others.every(o => Math.hypot(o.x - x, o.y - y) > o.r + r + 16)) return { x, y };
    }
    return { x: (x0 + x1) / 2, y: (y0 + y1) / 2 };
}

function reflect(e, nx, ny) {
    const dot = e.vx * nx + e.vy * ny;
    if (dot < 0) { e.vx -= 2 * dot * nx; e.vy -= 2 * dot * ny; }
}

// выталкивает участника из стен, деревьев, фонтанов и отражает его направление
function resolveObstacles(e) {
    for (const o of obstacles) {
        if (o.t === 'circle') {
            let dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy);
            const min = e.r + o.r;
            if (d >= min) continue;
            if (d === 0) { dx = 1; dy = 0; d = 1; }
            const nx = dx / d, ny = dy / d;
            e.x = o.x + nx * min; e.y = o.y + ny * min;
            reflect(e, nx, ny);
        } else {
            const cx = clamp(e.x, o.x, o.x + o.w), cy = clamp(e.y, o.y, o.y + o.h);
            let dx = e.x - cx, dy = e.y - cy, d = Math.hypot(dx, dy);
            if (d >= e.r) continue;
            if (d === 0) {
                // центр внутри стены: выталкиваем через ближайшую сторону
                const l = e.x - o.x, rt = o.x + o.w - e.x, tp = e.y - o.y, bt = o.y + o.h - e.y;
                const m = Math.min(l, rt, tp, bt);
                let nx = 0, ny = 0;
                if (m === l) { nx = -1; e.x = o.x - e.r; }
                else if (m === rt) { nx = 1; e.x = o.x + o.w + e.r; }
                else if (m === tp) { ny = -1; e.y = o.y - e.r; }
                else { ny = 1; e.y = o.y + o.h + e.r; }
                reflect(e, nx, ny);
            } else {
                const nx = dx / d, ny = dy / d;
                e.x = cx + nx * e.r; e.y = cy + ny * e.r;
                reflect(e, nx, ny);
            }
        }
    }
}

/* ================= Раунд ================= */
function newRound() {
    map = pick(MAPS);
    buildMap();
    stage = 1; playersWon = false; victoryT = 0; fwT = 0; confetti = [];
    arena = { ...ARENA1 }; arenaTarget = { ...ARENA1 };

    const semyon = makeEnt({
        kind: 'enemy', nick: 'Семён', title: 'Семён · враг', img: IMGS.enemy, color: '#f87171',
        x: 0, y: 0, r: CFG.enemySize / 2,
        hp: CFG.enemyHP, max: CFG.enemyHP,
        speed: CFG.enemySpeed, spin: 3.6, swordLen: 44
    });
    semyon.fartIn = rand(CFG.fartMin, CFG.fartMax);

    const glеb = makeEnt({
        kind: 'enemy', helper: true, nick: 'Глеб', title: 'Глеб · помощник', img: IMGS.helper, color: '#fb923c',
        x: 0, y: 0, r: CFG.helperSize / 2,
        hp: CFG.helperHP, max: CFG.helperHP,
        speed: CFG.helperSpeed, spin: 3.3, swordLen: 40
    });

    const team = [['Ваня', IMGS.t1], ['Даня', IMGS.t2], ['Матвей', IMGS.t3]].map(([nick, img], i) => makeEnt({
        kind: 'team', nick, title: nick, img, color: '#38bdf8',
        x: 0, y: 0, r: CFG.teamSize / 2,
        hp: CFG.teamHP, max: CFG.teamHP,
        speed: CFG.teamSpeed, spin: 3 + i * 0.5, swordLen: 40
    }));

    // враг и помощник слева, игроки справа, места случайные и не в препятствиях
    const placed = [];
    [semyon, glеb].forEach(e => {
        const p = findSpot(e.r, arena.x, arena.x + arena.w * 0.45, arena.y, arena.y + arena.h, placed);
        e.x = p.x; e.y = p.y; placed.push(e);
    });
    team.forEach(e => {
        const p = findSpot(e.r, arena.x + arena.w * 0.55, arena.x + arena.w, arena.y, arena.y + arena.h, placed);
        e.x = p.x; e.y = p.y; placed.push(e);
    });

    ents = [semyon, glеb, ...team];
    ents.forEach((e, i) => { e.role = ROLES[i].id; });
    enemy = semyon;
    helperEnt = glеb;
    pickups = []; particles = []; puffs = []; puddles = []; angels = []; droppedSwords = []; drops = []; ripples = []; texts = [];
    ev = { phase: 'wait', t: CFG.eventGap, def: null, potion: null, proj: null, rain: 0, bannerT: 0, bannerText: '', bannerColor: '#fff' };
    freeze = { t: 0, owner: null, wave: 0, bannerT: 0, bannerText: '' };
    freezeActive = false;
    spawnT = 0;
    countT = 5;
    goT = 0;
    state = 'countdown';
}

/* ================= Геометрия ================= */
function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
const swordCount = e => (e.tripleT > 0 ? 3 : 1) + (e.extraSwords || 0);
const swordLenNow = e => e.swordLen * e.swordMul;
function swordAngle(e, k) { return e.angle + k * (Math.PI * 2 / swordCount(e)); }
function swordSeg(e, k) {
    const a = swordAngle(e, k);
    const c = Math.cos(a), s = Math.sin(a);
    const r0 = e.r + 14, r1 = e.r + 26 + swordLenNow(e);
    return [e.x + c * r0, e.y + s * r0, e.x + c * r1, e.y + s * r1];
}
// ивент «Укорочение мечей»: мечи у ВСЕХ становятся короткими
function swordTarget(e) {
    if (ev.phase === 'active' && ev.def && ev.def.id === 'swords') {
        return CFG.swordShort;
    }
    return 1;
}

/* ================= Эффекты ================= */
function netFx(f) { net.fx.push(f); if (net.fx.length > 300) net.fx.shift(); }
function addRipple(o) {
    if (net.mode === 'host') netFx(['r', Math.round(o.x), Math.round(o.y), o.life, o.big ? 1 : 0]);
    ripples.push(o);
}

function burst(x, y, color, n = 10, sp = 160) {
    if (net.mode === 'host') netFx(['b', Math.round(x), Math.round(y), color, n, sp]);
    for (let i = 0; i < n; i++) {
        const a = Math.random() * 6.283, v = sp * (0.3 + Math.random() * 0.7);
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.3, max: 0.8, color });
    }
}
function floatText(x, y, text, color = '#fff', size = 30) {
    if (net.mode === 'host') netFx(['t', Math.round(x), Math.round(y), text, color, size]);
    texts.push({ x, y, text, color, size, life: 1.4, max: 1.4 });
}

/* ================= Бусты ================= */
const PICKUP_DEFS = [['hp', 3], ['speed', 2], ['shield', 2], ['triple', 2], ['shrink', 2], ['time', 0.5], ['sword', 0.5], ['revive', 0.7]];   // «время» редкий
function pickType() {
    // буст возрождения появляется только если кто-то из игроков уже мёртв
    const anyDead = ents.some(e => e.kind === 'team' && !e.mutant && !e.alive);
    const defs = PICKUP_DEFS.filter(d => d[0] !== 'revive' || anyDead);
    let total = 0;
    defs.forEach(d => total += d[1]);
    let r = Math.random() * total;
    for (const [type, w] of defs) { r -= w; if (r < 0) return type; }
    return 'hp';
}
const pickupColor = t => ({
    hp: '#22c55e', speed: '#facc15', shield: '#60a5fa', triple: '#fb923c', shrink: '#a78bfa', time: '#e2e8f0', sword: '#f472b6', revive: '#fde047'
}[t]);

function spawnPickup() {
    let x = 0, y = 0;
    for (let n = 0; n < 40; n++) {
        x = arena.x + 40 + Math.random() * (arena.w - 80);
        y = arena.y + 40 + Math.random() * (arena.h - 80);
        if (isClear(x, y, 22, 6)) break;
    }
    pickups.push({
        type: pickType(), x, y,
        amount: 1 + Math.floor(Math.random() * 3),   // для HP-буста: +1, +2 или +3
        life: CFG.pickupLife, t: 0
    });
}

// кто может брать бусты: игроки; враг и помощник только во время ивента «Бусты для врага»
function canPickup(e) {
    if (!e.alive || e.mutant || e.dissolving || frozen(e)) return false;
    if (e.kind === 'team') return true;
    return e.kind === 'enemy' && ev.phase === 'active' && !!ev.def && ev.def.id === 'enemyboost';
}

// возрождение игрока на месте смерти (с анимацией ангела)
function spawnConfetti(n) {
    for (let i = 0, m = Math.floor(n) + (Math.random() < n % 1 ? 1 : 0); i < m; i++) {
        confetti.push({
            x: rand(0, W), y: rand(-40, -5), vx: rand(-40, 40), vy: rand(60, 200),
            rot: rand(0, 6), vr: rand(-8, 8), size: rand(6, 12),
            color: pick(['#facc15', '#f472b6', '#38bdf8', '#4ade80', '#fb923c', '#a78bfa', '#ffffff'])
        });
    }
}

function reviveEnt(t, x, y) {
    t.alive = true;
    t.hp = Math.max(1, Math.ceil(t.max / 2));
    t.x = clamp(x, arena.x + t.r, arena.x + arena.w - t.r);
    t.y = clamp(y, arena.y + t.r, arena.y + arena.h - t.r);
    t.shieldT = 2; t.flash = 0; t.extraSwords = 0;
    angels.push({ x: t.x, y: t.y, t: 0, life: CFG.angelTime, img: t.img, nick: t.nick });
    floatText(t.x, t.y - 90, t.nick + ' ВОЗРОДИЛСЯ!', '#fef9c3', 24);
    burst(t.x, t.y, '#fef08a', 50, 360);
}

function applyPickup(e, type, amount = 1) {
    if (type === 'hp') {
        e.hp = Math.min(e.max, e.hp + amount);
        floatText(e.x, e.y - e.r - 40, `+${amount} HP`, '#86efac', 22);
    }
    else if (type === 'speed') e.boostT = CFG.boostTime;
    else if (type === 'shield') e.shieldT = CFG.shieldTime;
    else if (type === 'triple') e.tripleT = CFG.tripleTime;
    else if (type === 'shrink') e.shrinkT = CFG.shrinkTime;
    else if (type === 'revive') {
        const dead = ents.filter(t => t.kind === 'team' && !t.mutant && !t.alive);
        if (dead.length) {
            const t = pick(dead);
            reviveEnt(t, t.deathX != null ? t.deathX : e.x, t.deathY != null ? t.deathY : e.y);
        }
    }
    else if (type === 'sword') {
        e.extraSwords++;
        floatText(e.x, e.y - e.r - 40, '+1 МЕЧ НАВСЕГДА', '#f9a8d4', 24);
    }
    else if (type === 'time') {
        freeze = { t: CFG.freezeTime, owner: e, wave: 0, bannerT: 2.4, bannerText: `${e.nick}: ОСТАНОВКА ВРЕМЕНИ` };
        freezeActive = true;
        burst(e.x, e.y, '#e2e8f0', 40, 400);
    }
}

/* ================= Пук Семёна ================= */
function addPuff(x, y, size = 1) {
    if (net.mode === 'host') netFx(['p', Math.round(x), Math.round(y), size]);
    puffs.push({
        x, y,
        vx: rand(-30, 30), vy: rand(-30, 30),
        r: rand(14, 28) * size,
        life: rand(1.1, 1.8), max: 1.8
    });
}
function doFart(e) {
    const n = Math.hypot(e.vx, e.vy) || 1;
    const dx = e.vx / n, dy = e.vy / n;
    e.dashT = CFG.dashTime;
    // облако позади (реактивная тяга), рывок вперёд по направлению полёта
    for (let i = 0; i < 12; i++) {
        addPuff(e.x - dx * (e.r + i * 7) + rand(-10, 10), e.y - dy * (e.r + i * 7) + rand(-10, 10), 1.2);
    }
    floatText(e.x - dx * (e.r + 40), e.y - dy * (e.r + 40), pick(['ПРРРРР!', 'ПФФФТ!', 'БРРРП!']), '#d9f99d', 34);
}

/* ================= Ивенты ================= */
function startEvent() {
    const def = pick(EVENTS);
    ev.phase = 'active';
    ev.def = def;
    ev.t = def.duration;
    ev.bannerT = 2.5;
    ev.bannerText = def.name;
    ev.bannerColor = def.color;
    if (def.id === 'acid') {
        // зелье получает случайный участник: Семён, Глеб или любой живой игрок
        const pool = ents.filter(e => e && e.alive && !e.mutant);
        if (pool.length > 0) {
            const owner = pick(pool);
            ev.potion = { owner, t: CFG.potionTime, x: owner.x, y: owner.y };
        } else {
            ev.potion = null;
        }
        ev.proj = null;
    }
}

function endEvent() {
    ev.phase = 'wait';
    ev.t = CFG.eventGap;
    ev.potion = null;
    ev.bannerT = 2;
    ev.bannerText = ev.def ? ev.def.endText : '';
    ev.bannerColor = '#cbd5e1';
    // кислотные мечи снова обычные
    ents.forEach(e => { e.acidSword = false; });
    // мутанты прекращают атаку и растворяются
    ents.forEach(e => {
        if (e.mutant && e.alive && !e.dissolving) {
            e.dissolving = true;
            e.dissolveT = CFG.dissolveTime;
            e.vx = 0; e.vy = 0;
        }
    });
}

function spawnMutant(x, y) {
    const face = pick(FACES);
    const side = face.side;      // игрок -> за игроков, Семён/Глеб -> за врагов
    const m = makeEnt({
        kind: side, mutant: true, immortal: true, origin: face.nick,
        nick: face.nick, title: face.nick, img: face.img,
        color: side === 'team' ? '#38bdf8' : '#f87171',
        x, y, r: 1,
        hp: 1, max: 1,
        speed: CFG.mutantSpeed, spin: 3.4, swordLen: 40
    });
    m.baseR = CFG.mutantSize / 2;   // плавно вырастает до этого размера
    ents.push(m);
    burst(x, y, '#4ade80', 40, 320);
    addRipple({ x, y, t: 0, life: 0.8, big: true });
    floatText(x, y - 70, side === 'team' ? 'МУТАНТ ЗА ИГРОКОВ' : 'МУТАНТ ЗА ВРАГА',
              side === 'team' ? '#7dd3fc' : '#fca5a5', 24);
}

function updateEvent(dt) {
    ev.t -= dt;
    if (ev.t <= 0) {
        if (ev.phase === 'wait') startEvent();
        else endEvent();
    }
    if (ev.phase !== 'active' || !ev.def) return;

    if (ev.def.id === 'acid') {
        // зелье в руках
        if (ev.potion) {
            const p = ev.potion;
            if (p.owner.alive) { p.x = p.owner.x; p.y = p.owner.y; }
            p.t -= dt;
            if (p.t <= 0) {
                let tx = arena.x + arena.w / 2, ty = arena.y + arena.h / 2;
                for (let n = 0; n < 40; n++) {
                    tx = rand(arena.x + 50, arena.x + arena.w - 50); ty = rand(arena.y + 50, arena.y + arena.h - 50);
                    if (isClear(tx, ty, 60, 6)) break;
                }
                ev.proj = { sx: p.x, sy: p.y, tx, ty, t: 0 };
                ev.potion = null;
            }
        }
        // зелье в полёте
        if (ev.proj) {
            ev.proj.t += dt;
            if (ev.proj.t >= CFG.potionFlight) {
                spawnMutant(ev.proj.tx, ev.proj.ty);
                ev.proj = null;
            }
        }
    }
}

/* ================= Этап босса ================= */
function startBossStage() {
    stage = 2;
    ents.filter(e => e.mutant).forEach(m => burst(m.x, m.y, '#bef264', 20, 220));
    ents = ents.filter(e => e.kind === 'team' && !e.mutant);     // Семён, Глеб и мутанты уходят
    pickups = []; puddles = []; drops = []; angels = []; puffs = [];
    ev = { phase: 'wait', t: 15, def: null, potion: null, proj: null, rain: 0, bannerT: 0, bannerText: '', bannerColor: '#fff' };
    freeze = { t: 0, owner: null, wave: 0, bannerT: 0, bannerText: '' };
    freezeActive = false;
    arenaTarget = { ...ARENA2 };               // карта увеличивается
    addRipple({ x: W / 2, y: H / 2, t: 0, life: 1.2, big: true });

    // игроки: живые отхиливаются до 25 HP, мёртвые остаются мёртвыми
    const placed = [];
    ents.forEach(e => {
        e.max = CFG.bossTeamHP;
        if (e.alive) {
            e.hp = e.max; e.flash = 0; e.shieldT = 0;
            const pos = findSpot(e.r, W * 0.55, W, 0, H, placed);
            e.x = pos.x; e.y = pos.y; placed.push(e);
            burst(e.x, e.y, '#4ade80', 24, 240);
            floatText(e.x, e.y - e.r - 40, '+HP ' + e.max, '#86efac', 24);
        }
    });

    const boss = makeEnt({
        kind: 'enemy', boss: true, role: 'semyon', nick: 'БОСС', title: 'БОСС', img: IMGS.boss, color: '#c084fc',
        x: 0, y: 0, r: 1, hp: CFG.bossHP, max: CFG.bossHP,
        speed: CFG.bossSpeed, spin: 3.2, swordLen: 56
    });
    boss.baseR = CFG.bossSize / 2;               // плавно вырастает
    const bp = findSpot(boss.baseR, 0, W * 0.45, 0, H, placed);
    boss.x = bp.x; boss.y = bp.y;
    boss.fartIn = rand(CFG.fartMin, CFG.fartMax);
    ents.push(boss);
    enemy = boss;
    burst(boss.x, boss.y, '#c084fc', 60, 400);
    state = 'countdown'; countT = 3; goT = 0; spawnT = 0;
}

/* ================= Урон ================= */
function damage(target, dmg = 1, color = '#ef4444') {
    if (target.immortal) return;
    if (target.shieldT > 0) { burst(target.x, target.y, '#60a5fa', 6, 120); return; }
    target.hp = Math.max(0, target.hp - dmg);
    target.flash = 0.3;
    burst(target.x, target.y, color, 12, 200);
    if (target.hp <= 0) {
        target.alive = false;
        target.deathX = target.x; target.deathY = target.y;
        burst(target.x, target.y, '#fbbf24', 40, 320);
        if (target.extraSwords > 0) {
            droppedSwords.push({ x: target.x, y: target.y, n: target.extraSwords, t: 0 });
            floatText(target.x, target.y - 60, 'МЕЧ УПАЛ!', '#f9a8d4', 24);
            target.extraSwords = 0;
        }
    }
}

/* ================= Обновление ================= */
function updateVisuals(dt, wdt) {
    // визуальные системы: ограничение размера очередей для предотвращения зависания вкладки
    if (particles.length > 300) particles.splice(0, particles.length - 300);
    if (puffs.length > 150) puffs.splice(0, puffs.length - 150);
    if (texts.length > 60) texts.splice(0, texts.length - 60);
    if (ripples.length > 60) ripples.splice(0, ripples.length - 60);
    if (drops.length > 200) drops.splice(0, drops.length - 200);

    particles.forEach(p => { p.x += p.vx * wdt; p.y += p.vy * wdt; p.vx *= 0.96; p.vy *= 0.96; p.life -= wdt; });
    particles = particles.filter(p => p.life > 0);
    puffs.forEach(p => { p.x += p.vx * wdt; p.y += p.vy * wdt; p.vx *= 0.97; p.vy *= 0.97; p.life -= wdt; });
    puffs = puffs.filter(p => p.life > 0);
    texts.forEach(t => { t.y -= 40 * dt; t.life -= dt; });
    texts = texts.filter(t => t.life > 0);
    ripples.forEach(r => r.t += wdt);
    ripples = ripples.filter(r => r.t < r.life);
    puddles.forEach(p => { p.t += wdt; p.life -= wdt; });
    puddles = puddles.filter(p => p.life > 0);
    angels.forEach(a => a.t += wdt);
    angels = angels.filter(a => a.t < a.life);
    ev.bannerT = Math.max(0, ev.bannerT - dt);

    // плавное расширение арены
    ['x', 'y', 'w', 'h'].forEach(k => { arena[k] += (arenaTarget[k] - arena[k]) * Math.min(1, dt * 2.2); });

    // победа: салюты и конфетти
    if (state === 'over' && playersWon) {
        victoryT += dt;
        if (net.mode !== 'guest') fwT -= dt;
        if (net.mode !== 'guest' && fwT <= 0 && victoryT < 14) {
            fwT = 0.45;
            const fx = rand(100, W - 100), fy = rand(70, H * 0.55);
            burst(fx, fy, pick(['#facc15', '#f472b6', '#38bdf8', '#4ade80', '#fb923c']), 36, 300);
            addRipple({ x: fx, y: fy, t: 0, life: 0.6 });
        }
        if (victoryT < 12) spawnConfetti(dt * 70);
    }
    confetti.forEach(c => { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 90 * dt; c.rot += c.vr * dt; });
    confetti = confetti.filter(c => c.y < H + 30);

    // кислотный дождь (плавно появляется и исчезает)
    const rainOn = ev.phase === 'active' && ev.def && ev.def.id === 'acid';
    ev.rain += ((rainOn ? 1 : 0) - ev.rain) * Math.min(1, dt * 2);
    if (ev.rain > 0.02) {
        const n = ev.rain * 170 * wdt;
        for (let i = 0; i < n + (Math.random() < n % 1 ? 1 : 0); i++) {
            drops.push({ x: rand(0, W), y: -30, len: rand(14, 26), v: rand(800, 1100), ty: rand(H * 0.25, H) });
        }
    }
    drops.forEach(d => {
        d.y += d.v * wdt;
        if (d.y >= d.ty) {
            d.dead = true;
            if (Math.random() < 0.5) ripples.push({ x: d.x, y: d.ty, t: 0, life: 0.45 });
        }
    });
    drops = drops.filter(d => !d.dead);
}

function update(dt) {
    // остановка времени
    freezeActive = false;
    if (freeze.t > 0 && freeze.owner) {
        freeze.t -= dt;
        freeze.wave += dt;
        if (freeze.t <= 0 || !freeze.owner.alive) { freeze.t = 0; freeze.owner = null; }
        else freezeActive = true;
    }
    freeze.bannerT = Math.max(0, freeze.bannerT - dt);
    const wdt = freezeActive ? dt * 0.05 : dt;      // мир «почти стоит»

    // таймеры, мечи, размер, растворение (замороженные не обновляются)
    ents.forEach(e => {
        if (!e.alive || frozen(e)) return;
        e.angle += e.spin * dt;
        e.flash = Math.max(0, e.flash - dt);
        e.boostT = Math.max(0, e.boostT - dt);
        e.shieldT = Math.max(0, e.shieldT - dt);
        e.tripleT = Math.max(0, e.tripleT - dt);
        e.shrinkT = Math.max(0, e.shrinkT - dt);
        e.puddleCd = Math.max(0, e.puddleCd - dt);
        e.swordMul += (swordTarget(e) - e.swordMul) * Math.min(1, dt * 4);
        let targetR = e.baseR * (e.shrinkT > 0 ? CFG.shrinkScale : 1);
        if (e.dissolving) targetR = e.baseR * 0.55;
        e.r += (targetR - e.r) * Math.min(1, dt * 8);
        e.hits.forEach((v, k) => { if (v > 0) e.hits.set(k, v - dt); });

        if (e.dissolving) {
            e.dissolveT -= dt;
            if (Math.random() < dt * 40) {
                particles.push({
                    x: e.x + rand(-e.r, e.r), y: e.y + rand(-e.r * 0.5, e.r * 0.5),
                    vx: rand(-30, 30), vy: rand(-90, -20),
                    life: 0.8, max: 0.8, color: pick(['#84cc16', '#a3e635', '#4ade80'])
                });
            }
            if (e.dissolveT <= 0) {
                e.alive = false;
                puddles.push({ x: e.x, y: e.y, r: CFG.puddleR, life: CFG.puddleLife, t: 0 });
                burst(e.x, e.y, '#bae6fd', 24, 200);
                // 30%: тот, кто был кислотным, возрождается (анимация ангела)
                if (state !== 'over' && Math.random() < CFG.reviveChance) {
                    const orig = ents.find(o => !o.mutant && !o.alive && o.nick === e.origin);
                    if (orig) {
                        orig.alive = true;
                        orig.hp = Math.max(1, Math.ceil(orig.max / 2));
                        orig.x = e.x; orig.y = e.y;
                        orig.shieldT = 2; orig.flash = 0;
                        orig.extraSwords = 0;
                        angels.push({ x: e.x, y: e.y, t: 0, life: CFG.angelTime, img: orig.img, nick: orig.nick });
                        floatText(e.x, e.y - 90, orig.nick + ' ВОЗРОДИЛСЯ!', '#fef9c3', 26);
                        burst(e.x, e.y, '#fef08a', 50, 360);
                    }
                }
            }
        }
    });
    ents = ents.filter(e => e.alive || !e.mutant);

    updateVisuals(dt, wdt);

    if (state === 'countdown') {
        countT -= dt;
        if (countT <= 0) { state = 'go'; goT = 0.8; }
        return;
    }
    if (state === 'go') { goT -= dt; if (goT <= 0) state = 'play'; }
    if (state === 'over') return;

    // управление: каждый игрок меняет направление своей роли, скорость постоянная
    ents.forEach(e => {
        if (!e.alive || e.mutant || e.dissolving || !e.role || frozen(e)) return;
        const k = roleInput(e.role);
        if (!k) return;                     // роль без игрока — бот
        if (k[0]) e.vx = k[0] * Math.max(0.35, Math.abs(e.vx));
        if (k[1]) e.vy = k[1] * Math.max(0.35, Math.abs(e.vy));
    });

    // пук Семёна каждые 5-10 сек
    if (enemy.alive && !frozen(enemy)) {
        enemy.fartIn -= dt;
        if (enemy.fartIn <= 0) {
            doFart(enemy);
            enemy.fartIn = rand(CFG.fartMin, CFG.fartMax);
        }
    }

    // движение и стены экрана (стиль DVD)
    ents.forEach(e => {
        if (!e.alive || e.dissolving || frozen(e)) return;
        let sp = e.speed * (e.boostT > 0 ? CFG.boostMult : 1);
        if (e.dashT > 0) {
            sp *= 1 + CFG.dashMult * (e.dashT / CFG.dashTime);
            e.dashT = Math.max(0, e.dashT - dt);
            const n0 = Math.hypot(e.vx, e.vy) || 1;
            if (Math.random() < 0.6) addPuff(e.x - e.vx / n0 * e.r, e.y - e.vy / n0 * e.r, 0.8);
        }
        const n = Math.hypot(e.vx, e.vy) || 1;
        e.vx = e.vx / n; e.vy = e.vy / n;
        e.x += e.vx * sp * dt;
        e.y += e.vy * sp * dt;
        if (e.x - e.r < arena.x) { e.x = arena.x + e.r; e.vx = Math.abs(e.vx); }
        if (e.x + e.r > arena.x + arena.w) { e.x = arena.x + arena.w - e.r; e.vx = -Math.abs(e.vx); }
        if (e.y - e.r < arena.y) { e.y = arena.y + e.r; e.vy = Math.abs(e.vy); }
        if (e.y + e.r > arena.y + arena.h) { e.y = arena.y + arena.h - e.r; e.vy = -Math.abs(e.vy); }
        resolveObstacles(e);
    });

    // отскок друг от друга (замороженные стоят на месте)
    for (let i = 0; i < ents.length; i++) {
        for (let j = i + 1; j < ents.length; j++) {
            const a = ents[i], b = ents[j];
            if (!a.alive || !b.alive || a.dissolving || b.dissolving) continue;
            const aF = frozen(a), bF = frozen(b);
            if (aF && bF) continue;
            let dx = b.x - a.x, dy = b.y - a.y;
            let d = Math.hypot(dx, dy);
            const min = a.r + b.r;
            if (d >= min) continue;
            if (d === 0) { dx = 1; dy = 0; d = 1; }
            const nx = dx / d, ny = dy / d;
            const over = min - d;
            if (aF) {
                b.x += nx * over; b.y += ny * over; reflect(b, nx, ny);
            } else if (bF) {
                a.x -= nx * over; a.y -= ny * over; reflect(a, -nx, -ny);
            } else {
                a.x -= nx * over / 2; a.y -= ny * over / 2;
                b.x += nx * over / 2; b.y += ny * over / 2;
                const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
                if (rv > 0) {
                    a.vx -= rv * nx; a.vy -= rv * ny;
                    b.vx += rv * nx; b.vy += rv * ny;
                }
            }
        }
    }
    ents.forEach(e => { if (e.alive && !e.dissolving && !frozen(e)) resolveObstacles(e); });

    // мечи (замороженные мечи урон не наносят)
    ents.forEach(att => {
        if (!att.alive || att.dissolving || frozen(att)) return;
        const n = swordCount(att);
        const dmg = att.acidSword ? CFG.acidDamage : 1;
        for (let k = 0; k < n; k++) {
            const [x1, y1, x2, y2] = swordSeg(att, k);
            ents.forEach(tg => {
                if (!tg.alive || tg === att || tg.dissolving) return;
                const near = segDist(tg.x, tg.y, x1, y1, x2, y2) < tg.r;
                if (!near) return;

                // меч своего (не мутанта) задел кислотного мутанта своей команды ->
                // меч становится кислотным (урон 2x) до конца ивента
                if (tg.kind === att.kind) {
                    if (tg.mutant && !att.mutant && !att.acidSword) {
                        att.acidSword = true;
                        burst(att.x, att.y, '#a3e635', 30, 260);
                        floatText(att.x, att.y - att.r - 50, 'МЕЧ В КИСЛОТЕ 2×', '#bef264', 22);
                    }
                    return;
                }

                const key = tg.id + ':' + k;
                if ((att.hits.get(key) || 0) > 0) return;
                att.hits.set(key, CFG.hitCooldown);
                if (tg.immortal) burst(tg.x, tg.y, '#bef264', 6, 120);   // бессмертного не убить
                else damage(tg, dmg, (att.acidSword || att.mutant) ? '#84cc16' : '#ef4444');
            });
        }
    });

    // святая вода: +1 HP всем, кто в неё наступил
    ents.forEach(e => {
        if (!e.alive || e.immortal || e.dissolving || e.puddleCd > 0 || frozen(e)) return;
        for (const p of puddles) {
            const grow = Math.min(1, p.t / 0.6);
            if (Math.hypot(e.x - p.x, e.y - p.y) < p.r * grow + e.r * 0.4) {
                e.puddleCd = CFG.puddleTick;
                if (e.hp < e.max) {
                    e.hp = Math.min(e.max, e.hp + 1);
                    burst(e.x, e.y, '#bae6fd', 8, 120);
                    floatText(e.x, e.y - e.r - 30, '+1 HP святая вода', '#bae6fd', 20);
                }
                break;
            }
        }
    });

    // ивенты (на время остановки времени стоят)
    if (!freezeActive) updateEvent(dt);

    // конец раунда: Семён убит -> победа игроков; все игроки убиты -> победа врага
    if (ents.filter(e => e.kind === 'team' && !e.mutant).every(e => !e.alive)) { playersWon = false; state = 'over'; return; }
    if (stage === 1 && !enemy.alive && !helperEnt.alive) { startBossStage(); return; }
    if (stage === 2 && !enemy.alive) {
        playersWon = true; state = 'over'; victoryT = 0; fwT = 0;
        spawnConfetti(140);
        burst(enemy.x, enemy.y, '#c084fc', 80, 450);
        return;
    }

    // упавшие вечные мечи: кто коснулся — получает навсегда
    droppedSwords.forEach(d => d.t += dt);
    droppedSwords = droppedSwords.filter(d => {
        for (const e of ents) {
            if (!e.alive || e.mutant || e.dissolving || frozen(e)) continue;
            if (Math.hypot(d.x - e.x, d.y - e.y) < e.r + 20) {
                e.extraSwords += d.n;
                burst(d.x, d.y, '#f472b6', 18, 200);
                floatText(e.x, e.y - e.r - 40, '+' + d.n + ' МЕЧ НАВСЕГДА', '#f9a8d4', 24);
                return false;
            }
        }
        return true;
    });

    // бусты
    if (!freezeActive) {
        spawnT += dt;
        if (spawnT >= CFG.spawnEvery / (stage === 2 ? 2 : 1) && pickups.length < CFG.maxPickups * (stage === 2 ? 2 : 1)) { spawnPickup(); spawnT = 0; }
        pickups.forEach(p => { p.life -= dt; });
    }
    pickups.forEach(p => { p.t += dt; });
    pickups = pickups.filter(p => {
        if (p.life <= 0) return false;
        for (const e of ents) {
            if (!canPickup(e)) continue;
            if (p.type === 'revive' && !(e.kind === 'team' && ents.some(t => t.kind === 'team' && !t.mutant && !t.alive))) continue;
            if (Math.hypot(p.x - e.x, p.y - e.y) < e.r + 18) {
                applyPickup(e, p.type, p.amount);
                burst(p.x, p.y, pickupColor(p.type), 14, 180);
                return false;
            }
        }
        return true;
    });
}

/* ================= Рисование ================= */
function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function hpColor(f) { return f > 0.5 ? '#22c55e' : f > 0.25 ? '#facc15' : '#ef4444'; }

function bar(x, y, w, h, f, color) {
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    rr(x, y, w, h, h / 2); ctx.fill();
    if (f > 0) {
        ctx.fillStyle = color;
        rr(x, y, Math.max(h, w * f), h, h / 2); ctx.fill();
    }
}

function avatar(img, cx, cy, r, ring, dim, tint = 0) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.clip();
    if (ready(img)) {
        const s = Math.max(2 * r / img.naturalWidth, 2 * r / img.naturalHeight);
        const w = img.naturalWidth * s, h = img.naturalHeight * s;
        ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
    } else {
        ctx.fillStyle = '#334155'; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
        ctx.fillStyle = '#94a3b8'; ctx.font = `bold ${r}px Arial`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', cx, cy);
    }
    if (dim) { ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r); }
    if (tint > 0) { ctx.fillStyle = `rgba(132,204,22,${tint})`; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283);
    ctx.lineWidth = Math.max(2, r * 0.07);
    ctx.strokeStyle = ring; ctx.stroke();
}

function drawSword(e, k) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(swordAngle(e, k));
    const L = swordLenNow(e);
    const x0 = e.r + 6;
    const bx = x0 + 20;
    const wscale = 0.6 + 0.4 * Math.min(1, e.swordMul);       // нож уже меча
    const bw = 7 * wscale;
    const acidLook = !!(e.mutant || e.acidSword);
    const glow = acidLook ? '#84cc16' : (e.kind === 'enemy' ? '#f87171' : '#38bdf8');

    // рукоять
    ctx.fillStyle = '#5b3a1e';
    rr(x0 + 2, -3.5, 14, 7, 2); ctx.fill();
    ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 1;
    for (let i = 5; i < 16; i += 4) { ctx.beginPath(); ctx.moveTo(x0 + i, -3.5); ctx.lineTo(x0 + i, 3.5); ctx.stroke(); }
    // навершие
    const pg = ctx.createRadialGradient(x0 - 1, -1, 1, x0, 0, 6);
    pg.addColorStop(0, '#fde68a'); pg.addColorStop(1, '#b45309');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(x0, 0, 5, 0, 6.283); ctx.fill();
    // гарда
    const gg = ctx.createLinearGradient(0, -15, 0, 15);
    gg.addColorStop(0, '#fcd34d'); gg.addColorStop(0.5, '#b45309'); gg.addColorStop(1, '#fcd34d');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.moveTo(x0 + 14, -4); ctx.lineTo(x0 + 18, -15); ctx.lineTo(x0 + 22, -15);
    ctx.lineTo(x0 + 22, 15); ctx.lineTo(x0 + 18, 15); ctx.lineTo(x0 + 14, 4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1; ctx.stroke();

    // клинок
    ctx.shadowColor = glow; ctx.shadowBlur = acidLook ? 22 : 14;
    const bg2 = ctx.createLinearGradient(0, -bw, 0, bw);
    if (acidLook) {
        bg2.addColorStop(0, '#ecfccb'); bg2.addColorStop(0.5, '#a3e635'); bg2.addColorStop(1, '#4d7c0f');
    } else {
        bg2.addColorStop(0, '#f8fafc'); bg2.addColorStop(0.5, '#cbd5e1'); bg2.addColorStop(1, '#64748b');
    }
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.moveTo(bx, -bw);
    ctx.lineTo(bx + L * 0.82, -bw * 0.85);
    ctx.lineTo(bx + L, 0);
    ctx.lineTo(bx + L * 0.82, bw * 0.85);
    ctx.lineTo(bx, bw);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    if (L > 30) {
        ctx.strokeStyle = acidLook ? 'rgba(63,98,18,0.8)' : 'rgba(71,85,105,0.8)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(bx + 2, 0); ctx.lineTo(bx + L * 0.85, 0); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(bx + 2, -bw * 0.65); ctx.lineTo(bx + L * 0.8, -bw * 0.5); ctx.stroke();
    }
    ctx.restore();
}

function drawEnt(e) {
    if (!e || !e.alive) return;
    const dis = e.dissolving ? 1 - Math.max(0, e.dissolveT) / CFG.dissolveTime : 0;

    // лужа, в которую превращается мутант
    if (e.dissolving) {
        const R = CFG.puddleR * (0.25 + 0.75 * dis);
        const g = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, R);
        g.addColorStop(0, 'rgba(255,255,255,0.9)');
        g.addColorStop(1, 'rgba(56,189,248,0.25)');
        ctx.globalAlpha = 0.4 + 0.5 * dis;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
    }

    if (e.shieldT > 0) {
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8, 0, 6.283);
        ctx.strokeStyle = 'rgba(96,165,250,0.9)'; ctx.lineWidth = 4;
        ctx.shadowColor = '#60a5fa'; ctx.shadowBlur = 16; ctx.stroke(); ctx.shadowBlur = 0;
    }
    if (e.boostT > 0) {
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, 6.283);
        ctx.strokeStyle = 'rgba(250,204,21,0.8)'; ctx.lineWidth = 3;
        ctx.setLineDash([8, 8]); ctx.stroke(); ctx.setLineDash([]);
    }
    // враг и помощник во время ивента «Бусты для врага»: золотое кольцо
    if (e.kind === 'enemy' && !e.mutant && canPickup(e)) {
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 12, 0, 6.283);
        ctx.strokeStyle = 'rgba(251,191,36,0.9)'; ctx.lineWidth = 3;
        ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 16;
        ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
    }
    // кислотная аура (мутант)
    if (e.mutant && !e.dissolving) {
        const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 120);
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 10, 0, 6.283);
        ctx.strokeStyle = `rgba(163,230,53,${0.5 + 0.4 * pulse})`; ctx.lineWidth = 5;
        ctx.shadowColor = '#84cc16'; ctx.shadowBlur = 24; ctx.stroke(); ctx.shadowBlur = 0;
    }

    if (!e.dissolving) {
        const n = swordCount(e);
        for (let k = 0; k < n; k++) drawSword(e, k);
    }

    const blink = e.flash > 0 && Math.floor(e.flash * 20) % 2 === 0 ? 0.45 : 1;
    ctx.globalAlpha = blink * (1 - dis * 0.95);
    const ring = e.mutant ? '#a3e635' : (e.flash > 0 ? '#ef4444' : e.color);
    avatar(e.img || imgByNick(e.nick), e.x, e.y, e.r, ring, false, Math.max(e.mutant ? 0.35 : 0, dis * 0.7));
    ctx.globalAlpha = 1;

    if (e.dissolving) return;

    // полоска HP / метка бессмертия + ник
    const w = Math.max(70, e.r * 1.6), h = 10;
    const x = e.x - w / 2, y = e.y - e.r - 24;
    const pill = (label, py, col, txtCol) => {
        ctx.font = 'bold 12px Arial, sans-serif';
        const lw = ctx.measureText(label).width + 16;
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; rr(e.x - lw / 2, py - 4, lw, 18, 9); ctx.fill();
        ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = txtCol;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, e.x, py + 5);
    };
    if (e.immortal) {
        pill(`∞ ${e.nick}`, y, '#a3e635', '#d9f99d');
    } else {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        rr(x - 2, y - 2, w + 4, h + 4, 7); ctx.fill();
        bar(x, y, w, h, e.hp / e.max, hpColor(e.hp / e.max));
        // ник над полоской
        ctx.font = 'bold 13px Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.strokeText(e.nick, e.x, y - 6);
        ctx.fillStyle = e.kind === 'enemy' ? '#fecaca' : '#bae6fd';
        ctx.fillText(e.nick, e.x, y - 6);
        if (e.acidSword) pill('КИСЛОТА 2×', y - 34, '#a3e635', '#d9f99d');
    }
}

function drawFlask(x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(226,232,240,0.25)';
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, 6.283); ctx.fill();
    rr(-5.5, -28, 11, 16, 3); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, 6.283); ctx.clip();
    const lg = ctx.createLinearGradient(0, -4, 0, 17);
    lg.addColorStop(0, '#86efac'); lg.addColorStop(1, '#15803d');
    ctx.fillStyle = lg; ctx.fillRect(-18, -4, 36, 22);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(-5, 6, 2.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5, 2, 1.8, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(1, 10, 1.5, 0, 6.283); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(241,245,249,0.95)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, 6.283); ctx.stroke();
    rr(-5.5, -28, 11, 16, 3); ctx.stroke();
    ctx.fillStyle = '#92400e'; rr(-7, -34, 14, 8, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI * 1.05, Math.PI * 1.35); ctx.stroke();
    ctx.restore();
}

function drawPickup(p) {
    if (p.life < 2.5 && Math.floor(p.life * 6) % 2 === 0) return;
    const c = pickupColor(p.type) || '#ffffff';
    const pulse = 1 + Math.sin(p.t * 6) * 0.08;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.scale(pulse, pulse);
    ctx.shadowColor = c; ctx.shadowBlur = p.type === 'time' ? 26 : 18;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, 6.283);
    ctx.fillStyle = 'rgba(15,23,42,0.85)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = c; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = c; ctx.strokeStyle = c;
    if (p.type === 'hp') {
        ctx.font = '900 17px Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`+${p.amount}`, 0, 1);
    } else if (p.type === 'speed') {
        ctx.beginPath();
        ctx.moveTo(3, -12); ctx.lineTo(-7, 2); ctx.lineTo(-1, 2);
        ctx.lineTo(-3, 12); ctx.lineTo(8, -3); ctx.lineTo(1, -3);
        ctx.closePath(); ctx.fill();
    } else if (p.type === 'shield') {
        ctx.beginPath();
        ctx.moveTo(0, -12); ctx.lineTo(10, -8); ctx.lineTo(9, 3);
        ctx.quadraticCurveTo(6, 10, 0, 13); ctx.quadraticCurveTo(-6, 10, -9, 3);
        ctx.lineTo(-10, -8); ctx.closePath(); ctx.fill();
    } else if (p.type === 'triple') {
        ctx.lineCap = 'round'; ctx.lineWidth = 3.5;
        for (let k = 0; k < 3; k++) {
            const a = -Math.PI / 2 + k * (Math.PI * 2 / 3);
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * 3, Math.sin(a) * 3);
            ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13);
            ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 6.283); ctx.fill();
    } else if (p.type === 'revive') {
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(0, -13, 7, 2.5, 0, 0, 6.283); ctx.stroke();
        ctx.fillRect(-2.5, -7, 5, 19); ctx.fillRect(-8, -2, 16, 5);
    } else if (p.type === 'sword') {
        ctx.rotate(-Math.PI / 4);
        ctx.fillRect(-2, -13, 4, 18);
        ctx.beginPath(); ctx.moveTo(-2, -13); ctx.lineTo(0, -17); ctx.lineTo(2, -13); ctx.fill();
        ctx.fillRect(-7, 5, 14, 3);
        ctx.fillRect(-1.5, 8, 3, 5);
    } else if (p.type === 'time') {
        // часы
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 11, 0, 6.283); ctx.stroke();
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6, 3); ctx.stroke();
    } else {
        for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
            ctx.beginPath();
            ctx.moveTo(sx * 3, sy * 3);
            ctx.lineTo(sx * 12, sy * 6);
            ctx.lineTo(sx * 6, sy * 12);
            ctx.closePath(); ctx.fill();
        }
    }
    ctx.restore();
}

function drawPuddle(p) {
    const grow = Math.min(1, p.t / 0.6);
    const R = p.r * grow;
    const fade = Math.max(0, Math.min(1, p.life / 2));       // последние 2 сек гаснет
    const wob = 1 + Math.sin(p.t * 3) * 0.03;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = fade;
    const g = ctx.createRadialGradient(0, 0, Math.max(0.1, R * 0.1), 0, 0, Math.max(0.2, R));
    g.addColorStop(0, 'rgba(255,255,255,0.8)');
    g.addColorStop(0.7, 'rgba(125,211,252,0.5)');
    g.addColorStop(1, 'rgba(56,189,248,0.0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, R * wob, R * 0.9 / wob, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(224,242,254,0.9)'; ctx.lineWidth = 2;
    ctx.shadowColor = '#7dd3fc'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.ellipse(0, 0, R * 0.85 * wob, R * 0.75 / wob, 0, 0, 6.283); ctx.stroke();
    ctx.shadowBlur = 0;
    for (let i = 0; i < 5; i++) {
        const a = i * 1.7 + p.t * 0.4;
        const rad = R * (0.2 + 0.5 * ((i * 0.37 + p.t * 0.3) % 1));
        const bs = 2 + 3 * ((p.t * 1.5 + i * 0.3) % 1);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath(); ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad * 0.8, bs, 0, 6.283); ctx.fill();
    }
    ctx.restore();
}

function drawPuff(p) {
    const u = 1 - p.life / p.max;
    const r = p.r * (1 + u * 0.9);
    const a = (1 - u) * 0.55;
    const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, r);
    g.addColorStop(0, `rgba(190,205,70,${a})`);
    g.addColorStop(0.6, `rgba(150,170,50,${a * 0.7})`);
    g.addColorStop(1, 'rgba(120,140,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
}

function drawRain() {
    if (ev.rain > 0.02) {
        ctx.fillStyle = `rgba(132,204,22,${0.04 * ev.rain})`;
        ctx.fillRect(0, 0, W, H);
    }
    ctx.lineCap = 'round';
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(163,230,53,0.75)';
    ctx.beginPath();
    drops.forEach(d => { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y - d.len); });
    ctx.stroke();
    ripples.forEach(r => {
        const u = r.t / r.life;
        ctx.strokeStyle = `rgba(190,242,100,${(1 - u) * 0.8})`;
        ctx.lineWidth = r.big ? 4 : 2;
        const R = (r.big ? 90 : 18) * u + 3;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, R, R * 0.4, 0, 0, 6.283); ctx.stroke();
    });
}

function chip(x, y, text, color) {
    ctx.font = 'bold 10px Arial, sans-serif';
    const w = ctx.measureText(text).width + 10;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(x, y, w, 14, 7); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 5, y + 7.5);
    return w + 4;
}

function boostChips(e, x, y) {
    if (freezeActive && freeze.owner === e) x += chip(x, y, `время ${Math.ceil(freeze.t)}`, '#e2e8f0');
    if (e.boostT > 0) x += chip(x, y, `⚡ ${Math.ceil(e.boostT)}`, '#facc15');
    if (e.shieldT > 0) x += chip(x, y, `🛡 ${Math.ceil(e.shieldT)}`, '#60a5fa');
    if (e.tripleT > 0) x += chip(x, y, `3× меч ${Math.ceil(e.tripleT)}`, '#fb923c');
    if (e.shrinkT > 0) x += chip(x, y, `мини ${Math.ceil(e.shrinkT)}`, '#a78bfa');
    if (e.acidSword) x += chip(x, y, 'кислота 2×', '#a3e635');
    if (e.extraSwords > 0) x += chip(x, y, `+${e.extraSwords} меч навсегда`, '#f472b6');
}

const fmt = s => {
    const t = Math.max(0, Math.ceil(s));
    return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
};

function drawEventTimer() {
    const w = 230, h = 40, x = W / 2 - w / 2, y = 8;
    const active = ev.phase === 'active' && ev.def;
    const col = active ? ev.def.color : '#94a3b8';
    ctx.fillStyle = 'rgba(15,23,42,0.7)'; rr(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = active ? col : 'rgba(148,163,184,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();

    // иконка-капля
    ctx.save();
    ctx.translate(x + 18, y + 18);
    ctx.fillStyle = active ? col : '#64748b';
    ctx.shadowColor = col; ctx.shadowBlur = active ? 8 : 0;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(8, 2, 0, 8);
    ctx.quadraticCurveTo(-8, 2, 0, -8);
    ctx.fill();
    ctx.restore();

    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.font = 'bold 9px Arial, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(active ? (freezeActive ? 'ВРЕМЯ ОСТАНОВЛЕНО' : 'ИВЕНТ ИДЁТ') : 'ДО ИВЕНТА', x + 34, y + 15);
    ctx.font = 'bold 12px Arial, sans-serif';
    ctx.fillStyle = active ? col : '#e2e8f0';
    ctx.fillText(active ? ev.def.name : 'СЛУЧАЙНЫЙ ИВЕНТ', x + 34, y + 29);
    ctx.textAlign = 'right';
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(fmt(ev.t), x + w - 12, y + 25);

    const total = active ? ev.def.duration : CFG.eventGap;
    bar(x + 10, y + h - 6, w - 20, 3, Math.max(0, Math.min(1, ev.t / total)), active ? col : '#64748b');
}

// компактная карточка участника
function drawCard(e, x, y, w, h, ring) {
    if (!e) return;
    ctx.globalAlpha = e.alive ? 1 : 0.5;
    ctx.fillStyle = 'rgba(15,23,42,0.7)'; rr(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = e.alive ? ring : 'rgba(148,163,184,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    avatar(e.img || imgByNick(e.nick), x + 22, y + 22, 14, e.alive ? ring : '#64748b', !e.alive);

    ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 11px Arial, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(e.title || e.nick || '', x + 44, y + 17);
    ctx.textAlign = 'right';
    ctx.fillText(e.alive ? `${e.hp}/${e.max}` : 'ВЫБЫЛ', x + w - 8, y + 17);
    bar(x + 44, y + 23, w - 52, 7, (e.max ? e.hp / e.max : 0), hpColor(e.max ? e.hp / e.max : 0));
    if (e.alive) boostChips(e, x + 8, y + h - 17);
    ctx.globalAlpha = 1;
}

function drawHUD() {
    const cw = 150, ch = 50, m = 6;
    // враг и помощник слева сверху (на этапе босса — только босс)
    if (stage === 2) {
        if (enemy) drawCard(enemy, m, m, cw, ch, '#c084fc');
    } else {
        if (enemy) drawCard(enemy, m, m, cw, ch, '#f87171');
        if (helperEnt) drawCard(helperEnt, m, m + ch + 6, cw, ch, '#fb923c');
    }

    // игроки колонкой справа сверху
    const team = ents.filter(e => e && e.kind === 'team' && !e.mutant);
    team.forEach((e, i) => {
        drawCard(e, W - cw - m, m + i * (ch + 6), cw, ch, '#38bdf8');
