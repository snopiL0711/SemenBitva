    drawEventTimer();
}

function bigText(text, size, y, color = '#fff', scale = 1) {
    ctx.save();
    ctx.translate(W / 2, y); ctx.scale(scale, scale);
    ctx.font = `900 ${size}px Arial, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = size / 14; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineJoin = 'round';
    ctx.strokeText(text, 0, 0);
    ctx.fillStyle = color; ctx.fillText(text, 0, 0);
    ctx.restore();
}

function drawEventObjects() {
    // зелье в руках
    if (ev.potion) {
        const p = ev.potion;
        const bob = Math.sin(performance.now() / 160) * 4;
        const ownerR = (p.owner && p.owner.alive && p.owner.r) ? p.owner.r : 50;
        const fx = p.x, fy = p.y - ownerR - 90 + bob;
        drawFlask(fx, fy, 1, Math.sin(performance.now() / 220) * 0.15);
        ctx.font = 'bold 22px Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        const txt = String(Math.ceil(p.t));
        ctx.strokeText(txt, fx + 30, fy);
        ctx.fillStyle = '#bef264'; ctx.fillText(txt, fx + 30, fy);
    }
    // зелье в полёте
    if (ev.proj) {
        const q = ev.proj;
        const u = Math.min(1, q.t / CFG.potionFlight);
        const x = q.sx + (q.tx - q.sx) * u;
        const y = q.sy + (q.ty - q.sy) * u - Math.sin(Math.PI * u) * 170;
        ctx.fillStyle = 'rgba(34,197,94,0.25)';
        ctx.beginPath(); ctx.ellipse(q.tx, q.ty, 30 * u, 12 * u, 0, 0, 6.283); ctx.fill();
        drawFlask(x, y, 1.2, u * 14);
    }
}

function drawDroppedSword(d) {
    const pulse = 1 + Math.sin(d.t * 5) * 0.1;
    ctx.save();
    ctx.translate(d.x, d.y); ctx.scale(pulse, pulse); ctx.rotate(-Math.PI / 4);
    ctx.shadowColor = '#f472b6'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#f9a8d4';
    ctx.fillRect(-3, -20, 6, 28);
    ctx.beginPath(); ctx.moveTo(-3, -20); ctx.lineTo(0, -27); ctx.lineTo(3, -20); ctx.fill();
    ctx.fillStyle = '#fcd34d'; ctx.fillRect(-11, 8, 22, 4);
    ctx.fillStyle = '#92400e'; ctx.fillRect(-2, 12, 4, 8);
    ctx.restore();
}

function drawAngel(a) {
    if (!a || !a.life) return;
    const u = a.t / a.life;
    const alpha = u < 0.2 ? u / 0.2 : u > 0.75 ? (1 - u) / 0.25 : 1;
    const rise = u * 70;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    // столб света
    const g = ctx.createLinearGradient(0, a.y - 260, 0, a.y + 40);
    g.addColorStop(0, 'rgba(254,249,195,0)'); g.addColorStop(1, 'rgba(254,249,195,0.75)');
    ctx.fillStyle = g; ctx.fillRect(a.x - 36, a.y - 260, 72, 300);
    // крылья
    const ay = a.y - 40 - rise, flap = Math.sin(a.t * 9) * 0.18;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.shadowColor = '#fef08a'; ctx.shadowBlur = 24;
    for (const sd of [-1, 1]) {
        ctx.save(); ctx.translate(a.x + sd * 18, ay); ctx.rotate(sd * (0.5 + flap));
        ctx.beginPath(); ctx.ellipse(sd * 40, 0, 52, 18, 0, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sd * 34, 20, 40, 12, 0.3 * sd, 0, 6.283); ctx.fill();
        ctx.restore();
    }
    // лицо
    avatar(a.img || imgByNick(a.nick), a.x, ay, 28, '#fef08a', false);
    // нимб
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(a.x, ay - 40, 22, 7, 0, 0, 6.283); ctx.stroke();
    ctx.restore();
}

function applyCamera() {
    const me = net.myRole ? ents.find(e => e.role === net.myRole && !e.mutant) : null;
    const follow = !!me && net.camOn && Number.isFinite(me.x) && Number.isFinite(me.y);
    const targetZ = follow ? 1.5 : 1;
    cam.z += (targetZ - cam.z) * Math.min(1, frameDt * 5);
    if (!Number.isFinite(cam.z) || cam.z <= 0) cam.z = 1;
    const vw = W / cam.z, vh = H / cam.z;
    const fit = (want, lo, hi) => hi < lo ? (lo + hi) / 2 : Math.max(lo, Math.min(hi, want));
    const tx = fit(follow ? me.x - vw / 2 : (W - vw) / 2, arena.x - 20, arena.x + arena.w + 20 - vw);
    const ty = fit(follow ? me.y - vh / 2 : (H - vh) / 2, arena.y - 20, arena.y + arena.h + 20 - vh);
    if (!cam.init || !Number.isFinite(cam.x) || !Number.isFinite(cam.y)) { cam.x = tx; cam.y = ty; cam.init = true; }
    const k = Math.min(1, frameDt * 8);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
    if (!Number.isFinite(cam.x)) cam.x = (W - vw) / 2;
    if (!Number.isFinite(cam.y)) cam.y = (H - vh) / 2;
    ctx.setTransform(cam.z, 0, 0, cam.z, -cam.x * cam.z, -cam.y * cam.z);
}

// ник игрока под персонажем и маркер «это вы»
function drawTag(e) {
    if (!e || !e.alive || e.dissolving || e.mutant) return;
    const me = !!e.role && e.role === net.myRole;
    if (!e.player && !me) return;
    ctx.save();
    if (me) {
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 16, 0, 6.283);
        ctx.strokeStyle = 'rgba(253,224,71,0.95)'; ctx.lineWidth = 3;
        ctx.setLineDash([10, 8]); ctx.lineDashOffset = -performance.now() / 40;
        ctx.shadowColor = '#fde047'; ctx.shadowBlur = 14; ctx.stroke();
        ctx.setLineDash([]); ctx.shadowBlur = 0;
    }
    const label = (me ? 'ТЫ' : '') + (me && e.player ? ' · ' : '') + (e.player || '');
    ctx.font = 'bold 13px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.strokeText(label, e.x, e.y + e.r + 18);
    ctx.fillStyle = me ? '#fde047' : '#e2e8f0'; ctx.fillText(label, e.x, e.y + e.r + 18);
    ctx.restore();
}

function drawMap() {
    // границы арены (при росте светятся ярче)
    const a = arena, growing = Math.abs(arenaTarget.w - a.w) > 3;
    ctx.save();
    ctx.fillStyle = stage === 2 ? 'rgba(59, 23, 114, 0.45)' : 'rgba(15, 23, 42, 0.75)';
    rr(a.x + 2, a.y + 2, a.w - 4, a.h - 4, 14); ctx.fill();
    ctx.strokeStyle = stage === 2 ? 'rgba(192,132,252,0.95)' : 'rgba(148,163,184,0.75)';
    ctx.lineWidth = 4;
    ctx.shadowColor = stage === 2 ? '#c084fc' : '#94a3b8';
    ctx.shadowBlur = growing ? 34 : 12;
    rr(a.x + 2, a.y + 2, a.w - 4, a.h - 4, 14); ctx.stroke();
    ctx.restore();
}

function draw() {
    if (isObs) {
        ctx.clearRect(0, 0, W, H);
    } else {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, W, H);
    }
    if (net.mode === 'guest' && !net.haveSnap) {
        bigText('Ждём данные от хоста…', 28, H / 2, '#38bdf8');
        return;
    }

    // остановка времени: всё серое, кроме подобравшего
    const gray = freezeActive && typeof ctx.filter === 'string';
    const owner = freezeActive ? freeze.owner : null;
    if (gray) ctx.filter = 'grayscale(1) contrast(1.05)';

    applyCamera();
    drawMap();
    puddles.forEach(drawPuddle);
    droppedSwords.forEach(drawDroppedSword);
    pickups.forEach(drawPickup);
    puffs.forEach(drawPuff);
    ents.forEach(e => { if (!(owner && e === owner)) drawEnt(e); });
    ents.forEach(drawTag);
    drawEventObjects();
    angels.forEach(drawAngel);
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, 6.283); ctx.fill();
    });
    ctx.globalAlpha = 1;
    drawRain();

    if (gray) ctx.filter = 'none';

    // подобравший остановку времени: цветной, с волной и кольцом таймера
    if (owner && owner.alive) {
        if (freeze.wave < 0.9) {
            const u = freeze.wave / 0.9;
            ctx.strokeStyle = `rgba(255,255,255,${(1 - u) * 0.9})`; ctx.lineWidth = 8 * (1 - u) + 2;
            ctx.beginPath(); ctx.arc(owner.x, owner.y, u * Math.hypot(W, H), 0, 6.283); ctx.stroke();
        }
        drawEnt(owner);
        ctx.beginPath();
        ctx.arc(owner.x, owner.y, owner.r + 18, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (freeze.t / CFG.freezeTime));
        ctx.strokeStyle = 'rgba(226,232,240,0.95)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.shadowColor = '#e2e8f0'; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0;
    }

    // всплывающие надписи
    texts.forEach(t => {
        ctx.globalAlpha = Math.max(0, Math.min(1, t.life / (t.max * 0.5)));
        ctx.font = `900 ${t.size}px Arial, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = t.size / 6; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineJoin = 'round';
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
    });
    ctx.globalAlpha = 1;

    ctx.setTransform(1, 0, 0, 1, 0, 0);      // дальше — интерфейс без камеры
    drawHUD();

    // баннер остановки времени
    if (freeze.bannerT > 0 && state !== 'over') {
        ctx.globalAlpha = Math.min(1, freeze.bannerT / 0.6);
        bigText(freeze.bannerText, 30, 112, '#f1f5f9');
        ctx.globalAlpha = 1;
    }
    // баннер ивента
    else if (ev.bannerT > 0 && state !== 'over') {
        ctx.globalAlpha = Math.min(1, ev.bannerT / 0.6);
        bigText('ИВЕНТ!', 20, 78, '#e2e8f0');
        bigText(ev.bannerText, 38, 112, ev.bannerColor);
        ctx.globalAlpha = 1;
    }

    if (state === 'countdown') {
        const frac = countT - Math.floor(countT);
        bigText(String(Math.ceil(countT)), 130, H / 2 - 10, '#fff', 0.8 + frac * 0.4);
        if (stage === 2) {
            bigText('ФИНАЛЬНЫЙ БОСС!', 40, H / 2 + 70, '#c084fc');
            bigText('Игроки вылечены до ' + CFG.bossTeamHP + ' HP · бустов вдвое больше', 18, H / 2 + 105, '#fde68a');
        } else {
            bigText('Приготовьтесь!', 30, H / 2 + 70, '#cbd5e1');
            bigText('Карта: ' + map.name, 20, H / 2 + 102, '#fde68a');
        }
        const myR = ROLES.find(r => r.id === net.myRole);
        bigText(myR ? 'WASD / стрелки — вы: ' + (stage === 2 && myR.id === 'semyon' ? 'БОСС' : myR.nick) + ' · C — камера'
                    : 'Вы наблюдатель · C — камера', 16, H - 18, '#94a3b8');
    } else if (state === 'go') {
        bigText(stage === 2 ? 'ДОБИТЬ БОССА!' : 'БОЙ!', stage === 2 ? 80 : 110, H / 2, '#facc15');
    } else if (state === 'over') {
        if (playersWon) drawVictory();
        else {
            ctx.fillStyle = 'rgba(2,6,23,0.35)'; ctx.fillRect(0, 0, W, H);
            bigText('ВРАГ ПОБЕДИЛ!', 64, H / 2 - 20, '#f87171');
            bigText('R или клик — новый раунд', 24, H / 2 + 45, '#e2e8f0');
        }
    }
}

// победный экран с анимацией
function drawVictory() {
    const t = victoryT;
    ctx.fillStyle = `rgba(2,6,23,${Math.min(0.5, t * 0.5)})`; ctx.fillRect(0, 0, W, H);

    // вращающиеся золотые лучи
    ctx.save();
    ctx.translate(W / 2, H / 2 - 40);
    ctx.rotate(t * 0.35);
    const rays = 14, fade = Math.min(1, t * 1.5);
    for (let i = 0; i < rays; i++) {
        const a0 = i * (Math.PI * 2 / rays);
        ctx.fillStyle = `rgba(250,204,21,${0.13 * fade})`;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, Math.hypot(W, H), a0, a0 + Math.PI / rays);
        ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // конфетти
    confetti.forEach(c => {
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
        ctx.fillStyle = c.color; ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
        ctx.restore();
    });

    // заголовок с «выпрыгиванием»
    const u = Math.min(1, t / 0.7);
    const pop = 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2);   // easeOutBack
    const pulse = 1 + Math.sin(t * 4) * 0.025;
    ctx.save();
    ctx.shadowColor = '#facc15'; ctx.shadowBlur = 40;
    bigText('ПОБЕДА!', 96, H / 2 - 120, '#fde047', Math.max(0.01, pop) * pulse);
    ctx.restore();
    ctx.globalAlpha = Math.min(1, Math.max(0, (t - 0.5) * 2));
    bigText('ИГРОКИ ПОБЕДИЛИ БОССА', 30, H / 2 - 55, '#e2e8f0');

    // герои
    const team = ents.filter(e => e.kind === 'team' && !e.mutant);
    const gap = 130, x0 = W / 2 - (team.length - 1) * gap / 2, y = H / 2 + 35;
    team.forEach((e, i) => {
        const x = x0 + i * gap, bob = e.alive ? Math.sin(t * 5 + i) * 6 : 0;
        avatar(e.img, x, y + bob, 36, e.alive ? '#facc15' : '#64748b', !e.alive);
        ctx.font = 'bold 15px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineJoin = 'round';
        const label = e.alive ? `${e.nick} · ${e.hp} HP` : `${e.nick} · выбыл`;
        ctx.strokeText(label, x, y + 58); ctx.fillStyle = e.alive ? '#fef9c3' : '#94a3b8'; ctx.fillText(label, x, y + 58);
    });
    ctx.globalAlpha = 1;

    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
    bigText('R или клик — новый раунд', 22, H - 40, '#e2e8f0');
    ctx.globalAlpha = 1;
}

/* ================= Ввод ================= */
function localInput() {
    return [
        (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0),
        (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0)
    ];
}
// что нажимает роль: свой ввод / ввод удалённого игрока / null = бот
function roleInput(role) {
    if (net.mode === 'solo') return role === net.myRole ? localInput() : null;
    const pid = net.lobby && net.lobby.roles[role];
    if (!pid) return null;
    if (pid === net.id) return localInput();
    return net.inputs[pid] || [0, 0];
}
let lastSentInput = '';
function sendInput(force) {
    if (net.mode !== 'guest' || !net.running) return;
    const k = localInput(), str = k.join();
    if (!force && str === lastSentInput) return;
    lastSentInput = str;
    wsSend({ t: 'input', k });
}
function requestRestart() {
    if (!net.running || state !== 'over') return;
    if (net.mode === 'guest') wsSend({ t: 'restart' });
    else newRound();
}
addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    keys[e.code] = true;
    if (net.running && (e.code.startsWith('Arrow') || e.code === 'Space')) e.preventDefault();
    if (e.code === 'KeyR') requestRestart();
    if (e.code === 'KeyC') net.camOn = !net.camOn;
    sendInput();
});
addEventListener('keyup', e => { keys[e.code] = false; sendInput(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; sendInput(); });
addEventListener('mousedown', () => { requestRestart(); });

/* ================= Сеть ================= */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function wsSend(o) { if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(o)); }
setInterval(() => wsSend({ t: 'ping' }), 15000);       // держит соединение и «будит» бесплатный хостинг

function connect(then) {
    if (net.ws && net.ws.readyState === 1) return then();
    const custom = new URLSearchParams(location.search).get('server');
    if (!location.host && !custom) { menuMsg('Откройте игру через сервер (node server.js). Без него доступна только игра в одиночку.'); return; }
    const url = custom || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    menuMsg('Подключение…', '#94a3b8');
    let ws;
    try { ws = new WebSocket(url); } catch (e) { menuMsg('Не удалось подключиться к серверу'); return; }
    net.ws = ws;
    ws.onopen = () => { menuMsg(''); then(); };
    ws.onmessage = ev => { try { onNetMessage(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
    ws.onerror = () => menuMsg('Не удалось подключиться к серверу. Если он на бесплатном хостинге — подождите 30–60 секунд и повторите.');
    ws.onclose = () => {
        if (net.ws !== ws) return;
        net.ws = null;
        if (net.mode !== 'none') backToMenu('Соединение с сервером потеряно');
    };
}

function onNetMessage(m) {
    switch (m.t) {
        case 'joined':
            net.id = m.id; net.isHost = m.host; net.mode = m.host ? 'host' : 'guest';
            break;
        case 'lobby':
            net.lobby = m; updateMyRole();
            if (!net.running) { showPanel('lobby'); renderLobby(); }
            break;
        case 'start':
            net.lobby.roles = m.roles; updateMyRole(); beginGame();
            break;
        case 'snap':
            if (net.mode === 'guest') applySnap(m.d);
            break;
        case 'input':
            if (net.mode === 'host') net.inputs[m.from] = m.k;
            break;
        case 'restart':
            if (net.mode === 'host' && state === 'over') newRound();
            break;
        case 'closed':
            backToMenu('Хост закрыл лобби');
            break;
        case 'err':
            menuMsg(m.m);
            break;
    }
}

function updateMyRole() {
    const L = net.lobby;
    net.myRole = L ? (Object.keys(L.roles).find(k => L.roles[k] === net.id) || null) : null;
}
const playerName = role => {
    const L = net.lobby, pid = L && role && L.roles[role];
    const pl = pid && L.players.find(p => p.id === pid);
    return pl ? pl.name : '';
};

/* ----- снимок игры: хост -> игроки ----- */
const r1 = v => Math.round(v * 10) / 10;
function buildSnap() {
    ents.forEach(e => { e.player = playerName(e.role); });
    const E = e => ({
        id: e.id, role: e.role || '', player: e.player || '', nick: e.nick, title: e.title, kind: e.kind, color: e.color,
        helper: !!e.helper, boss: !!e.boss, mutant: !!e.mutant, immortal: !!e.immortal, dissolving: !!e.dissolving,
        dissolveT: r1(e.dissolveT || 0), x: r1(e.x), y: r1(e.y), r: r1(e.r), angle: Math.round(e.angle * 1000) / 1000,
        spin: e.spin, hp: e.hp, max: e.max, alive: !!e.alive, flash: r1(e.flash), shieldT: r1(e.shieldT), boostT: r1(e.boostT),
        tripleT: r1(e.tripleT), shrinkT: r1(e.shrinkT), swordMul: Math.round(e.swordMul * 100) / 100, swordLen: e.swordLen,
        acidSword: !!e.acidSword, extraSwords: e.extraSwords || 0
    });
    const po = ev.potion, pr = ev.proj;
    return {
        t: 'snap',
        d: {
            st: state, sg: stage, ct: r1(countT), gt: r1(goT), pw: playersWon,
            ar: [r1(arenaTarget.x), r1(arenaTarget.y), r1(arenaTarget.w), r1(arenaTarget.h)],
            e: ents.map(E),
            p: pickups.map(q => ({ type: q.type, x: r1(q.x), y: r1(q.y), amount: q.amount, life: r1(q.life), t: r1(q.t) })),
            u: puddles.map(q => ({ x: r1(q.x), y: r1(q.y), r: q.r, life: r1(q.life), t: r1(q.t) })),
            s: droppedSwords.map(q => ({ x: r1(q.x), y: r1(q.y), n: q.n, t: r1(q.t) })),
            a: angels.map(q => ({ x: r1(q.x), y: r1(q.y), t: r1(q.t), life: q.life, nick: q.nick })),
            ev: {
                ph: ev.phase, t: r1(ev.t), def: ev.def ? ev.def.id : null, bt: r1(ev.bannerT), bx: ev.bannerText, bc: ev.bannerColor,
                po: (po && po.owner) ? { o: po.owner.id, x: r1(po.x), y: r1(po.y), t: r1(po.t) } : null,
                pr: pr ? { sx: r1(pr.sx), sy: r1(pr.sy), tx: r1(pr.tx), ty: r1(pr.ty), t: r1(pr.t) } : null
            },
            fa: freezeActive,
            fr: { t: r1(freeze.t), o: freeze.owner ? freeze.owner.id : 0, w: r1(freeze.wave), bt: r1(freeze.bannerT), bx: freeze.bannerText },
            fx: net.fx.splice(0).slice(-100)
        }
    };
}

function applySnap(d) {
    if (!d) return;
    const wasOver = state === 'over';
    state = d.st; stage = d.sg; countT = d.ct; goT = d.gt; playersWon = !!d.pw;
    if (d.ar) {
        arenaTarget = { x: d.ar[0], y: d.ar[1], w: d.ar[2], h: d.ar[3] };
        if (!net.haveSnap) arena = { ...arenaTarget };
    }

    const old = new Map(ents.map(e => [e.id, e]));
    ents = (d.e || []).map(se => {
        let e = old.get(se.id);
        if (!e) e = Object.assign({ hits: new Map(), baseR: se.r, tx: se.x, ty: se.y, x: se.x, y: se.y }, se);
        else { const { x, y, ...rest } = se; Object.assign(e, rest); e.tx = x; e.ty = y; }
        e.img = imgByNick(e.nick);
        return e;
    });
    const byId = id => ents.find(e => e.id === id);
    enemy = ents.find(e => e.kind === 'enemy' && !e.helper && !e.mutant) || enemy;
    helperEnt = ents.find(e => e.helper) || helperEnt;

    pickups = d.p || []; puddles = d.u || []; droppedSwords = d.s || [];
    angels = (d.a || []).map(a => Object.assign({}, a, { img: imgByNick(a.nick) }));

    if (d.ev) {
        ev.phase = d.ev.ph; ev.t = d.ev.t; ev.def = d.ev.def ? EVENTS.find(x => x.id === d.ev.def) : null;
        ev.bannerT = d.ev.bt; ev.bannerText = d.ev.bx; ev.bannerColor = d.ev.bc;
        ev.potion = d.ev.po ? { owner: byId(d.ev.po.o) || { alive: false, r: 50 }, x: d.ev.po.x, y: d.ev.po.y, t: d.ev.po.t } : null;
        ev.proj = d.ev.pr;
    }

    net.freezeActive = !!d.fa;
    if (d.fr) {
        freeze.t = d.fr.t; freeze.owner = d.fr.o ? byId(d.fr.o) || null : null; freeze.wave = d.fr.w;
        freeze.bannerT = d.fr.bt; freeze.bannerText = d.fr.bx;
    }

    if (Array.isArray(d.fx)) {
        d.fx.forEach(f => {
            if (f[0] === 'b') burst(f[1], f[2], f[3], f[4], f[5]);
            else if (f[0] === 't') floatText(f[1], f[2], f[3], f[4], f[5]);
            else if (f[0] === 'r') ripples.push({ x: f[1], y: f[2], t: 0, life: f[3], big: !!f[4] });
            else if (f[0] === 'p') addPuff(f[1], f[2], f[3]);
        });
    }
    if (!wasOver && state === 'over') { victoryT = 0; if (playersWon) spawnConfetti(140); }
    net.haveSnap = true;
}

function guestUpdate(dt) {
    freezeActive = net.freezeActive;
    freeze.bannerT = Math.max(0, freeze.bannerT - dt);
    const wdt = freezeActive ? dt * 0.05 : dt;
    const k = Math.min(1, dt * 16);
    ents.forEach(e => {
        if (!Number.isFinite(e.x) || !Number.isFinite(e.y)) {
            e.x = Number.isFinite(e.tx) ? e.tx : arena.x + arena.w / 2;
            e.y = Number.isFinite(e.ty) ? e.ty : arena.y + arena.h / 2;
        }
        if (!Number.isFinite(e.tx)) e.tx = e.x;
        if (!Number.isFinite(e.ty)) e.ty = e.y;
        const dist = Math.hypot(e.tx - e.x, e.ty - e.y);
        if (dist > 160) { e.x = e.tx; e.y = e.ty; }
        else { e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k; }
        if (e.alive && !frozen(e)) e.angle = (e.angle || 0) + (e.spin || 3) * dt;
        e.flash = Math.max(0, (e.flash || 0) - dt);
    });
    pickups.forEach(q => { q.t += dt; q.life -= dt; });
    droppedSwords.forEach(q => { q.t += dt; });
    updateVisuals(dt, wdt);
}

/* ----- меню и лобби ----- */
function showPanel(name) {
    $('ui').style.display = 'flex';
    ['menu', 'lobby'].forEach(id => $(id).classList.toggle('hidden', id !== name));
}
function menuMsg(text, color) { const m = $('menuMsg'); m.textContent = text || ''; m.style.color = color || '#fca5a5'; }
function myName() {
    const n = ($('nameInp').value || '').trim().slice(0, 16) || 'Игрок';
    try { localStorage.setItem('dvd_name', n); } catch (e) { /* ignore */ }
    return n;
}
function renderLobby() {
    const L = net.lobby;
    if (!L) return;
    $('lobbyCode').textContent = L.code;
    const nameOf = Object.fromEntries(L.players.map(p => [p.id, p.name]));
    $('roles').innerHTML = ROLES.map(r => {
        const occ = L.roles[r.id], mine = occ === net.id;
        return '<div class="role' + (occ ? ' taken' : '') + (mine ? ' mine' : '') + '" data-role="' + r.id + '">' +
            '<img src="' + r.photo + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
            '<b>' + r.nick + '</b><span class="side ' + r.team + '">' + (r.team === 'enemy' ? 'враг' : 'игроки') + '</span>' +
            '<em>' + (occ ? esc(nameOf[occ] || '?') + (mine ? ' (вы)' : '') : 'БОТ') + '</em></div>';
    }).join('');
    $('roles').querySelectorAll('.role').forEach(el => { el.onclick = () => pickRole(el.dataset.role); });
    $('players').innerHTML = 'В лобби: ' + L.players.map(p => esc(p.name) + (p.id === L.host ? ' 👑' : '')).join(', ');
    const canStart = net.mode === 'solo' || L.host === net.id;
    $('btnStart').style.display = 'block';
    $('btnStart').disabled = !canStart;
    $('btnStart').textContent = canStart ? 'Старт' : 'Ждём, пока хост начнёт игру…';
}
function pickRole(id) {
    const L = net.lobby, occ = L.roles[id];
    if (occ && occ !== net.id) return;
    const want = occ === net.id ? null : id;
    if (net.mode === 'solo') {
        Object.keys(L.roles).forEach(k => { if (L.roles[k] === net.id) L.roles[k] = null; });
        if (want) L.roles[want] = net.id;
        updateMyRole(); renderLobby();
    } else wsSend({ t: 'role', role: want });
}
function backToMenu(msg) {
    if (net.ws) { const w = net.ws; net.ws = null; try { w.close(); } catch (e) { /* ignore */ } }
    net.mode = 'none'; net.running = false; net.lobby = null; net.myRole = null; net.haveSnap = false; net.id = null;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (isObs) ctx.clearRect(0, 0, W, H); else { ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, W, H); }
    showPanel('menu'); menuMsg(msg || '');
}

function beginGame() {
    $('ui').style.display = 'none';
    net.running = true; net.haveSnap = false; net.inputs = {}; net.fx = []; cam.init = false; net.freezeActive = false;
    lastSentInput = '';
    if (net.mode === 'guest') initGuestState(); else newRound();
}
function initGuestState() {
    ents = []; enemy = null; helperEnt = null; pickups = []; particles = []; puffs = []; puddles = []; drops = [];
    ripples = []; texts = []; angels = []; droppedSwords = []; confetti = [];
    ev = { phase: 'wait', t: 0, def: null, potion: null, proj: null, rain: 0, bannerT: 0, bannerText: '', bannerColor: '#fff' };
    freeze = { t: 0, owner: null, wave: 0, bannerT: 0, bannerText: '' };
    freezeActive = false; state = 'countdown'; stage = 1; countT = 5; goT = 0; playersWon = false; victoryT = 0;
    arena = { ...ARENA1 }; arenaTarget = { ...ARENA1 }; map = MAPS[0];
}

$('btnCreate').onclick = () => { const n = myName(); connect(() => wsSend({ t: 'create', name: n })); };
$('btnJoin').onclick = () => {
    const code = ($('codeInp').value || '').trim();
    if (code.length < 4) return menuMsg('Введите код из 4 символов');
    const n = myName();
    connect(() => wsSend({ t: 'join', name: n, code }));
};
$('btnSolo').onclick = () => {
    const n = myName();
    net.mode = 'solo'; net.id = 'me';
    const roles = {}; ROLES.forEach(r => { roles[r.id] = null; });
    net.lobby = { code: 'ОДИН', host: 'me', started: false, players: [{ id: 'me', name: n }], roles };
    updateMyRole(); showPanel('lobby'); renderLobby();
};
$('btnStart').onclick = () => {
    if (net.mode === 'solo') beginGame();
    else if (net.lobby && net.lobby.host === net.id) wsSend({ t: 'start' });
};
$('btnLeave').onclick = () => { wsSend({ t: 'leave' }); backToMenu(''); };
$('codeInp').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); });
try { $('nameInp').value = localStorage.getItem('dvd_name') || ''; } catch (e) { /* ignore */ }

/* ================= Цикл ================= */
function loop(t) {
    try {
        const dt = Math.min(0.05, (t - last) / 1000);
        last = t; frameDt = dt;
        if (net.running) {
            if (net.mode === 'guest') {
                guestUpdate(dt);
                net.inAcc += dt;
                if (net.inAcc > 0.3) { net.inAcc = 0; sendInput(true); }
            } else {
                update(dt);
                if (net.mode === 'solo') ents.forEach(e => { e.player = playerName(e.role); });
                if (net.mode === 'host') {
                    net.snapAcc += dt;
                    if (net.snapAcc >= 0.05) { net.snapAcc = 0; wsSend(buildSnap()); }
                }
            }
            draw();
        }
    } catch (err) {
        console.error("Game loop error:", err);
    } finally {
        requestAnimationFrame(loop);
    }
}

showPanel('menu');
requestAnimationFrame(loop);
</script>
